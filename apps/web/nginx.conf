# KU Food Hunt web — static SPA + reverse proxy to the API.
#
# Mirrors the dev proxy in apps/web/vite.config.ts and the rewrites in
# vercel.json, so /api, /uploads and /sitemap.xml are same-origin in every
# environment. That is what lets the admin session cookie (SameSite=Lax, no
# Domain attribute) work without any CORS involvement at all.

upstream kfh_api {
    server api:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA bundle is large (maplibre-gl); compression is not optional here.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # Photo uploads are capped at 4 MB server-side (lib/uploads.ts); allow a
    # little headroom for multipart overhead so multer returns its own clean
    # 413 PAYLOAD_TOO_LARGE instead of nginx returning an HTML error page.
    client_max_body_size 8m;

    include /etc/nginx/security-headers.conf;

    # ─────────────────────────────────────────────── API proxy
    #
    # X-Forwarded-For matters: the API resolves req.ip from it for every rate
    # limiter and for the salted IP hash on reviews and votes. With exactly one
    # proxy in front (this one), the app's `trust proxy: 1` reads the real client
    # address — and a client that forges its own X-Forwarded-For only prepends to
    # the list, so the value nginx appends still wins. Putting another proxy in
    # front of this one (a CDN) breaks that: req.ip then resolves to the CDN's
    # edge address, every rate limit becomes one global bucket, and the salted IP
    # hash is identical for every visitor. Change `trust proxy` to match the real
    # hop count before adding one.
    location /api/ {
        proxy_pass http://kfh_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://kfh_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /sitemap.xml {
        proxy_pass http://kfh_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /healthz {
        proxy_pass http://kfh_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # ─────────────────────────────────────────────── static assets
    #
    # Vite fingerprints everything under /assets/, so it is safe to cache hard.
    # `expires` is used rather than add_header so the server-level security
    # headers above stay inherited.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────── SPA fallback
    #
    # Client-side routing: every unknown path returns index.html and lets
    # react-router decide. index.html itself must never be cached, or a deploy
    # leaves browsers pointing at asset hashes that no longer exist.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
