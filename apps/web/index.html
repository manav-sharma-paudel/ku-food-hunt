<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons & manifest -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)" />

    <!-- Faster first image paint: warm up the image host early. -->
    <link rel="preconnect" href="https://picsum.photos" crossorigin />
    <link rel="dns-prefetch" href="https://picsum.photos" />

    <!-- Fallback title before React mounts. Every route then renders its own <Seo>,
         the single source for the title, canonical, description, and Open Graph /
         Twitter tags — kept out of here so React never fights a duplicate static tag.
         (React 19 dedupes <title> but not <meta>, so only the title lives statically.) -->
    <title>KU Food Hunt — Every great bite around KU</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
