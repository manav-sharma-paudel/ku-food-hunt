# Security headers for the static SPA.
#
# Kept in their own file and `include`d wherever they are needed, because nginx's
# add_header inheritance is all-or-nothing: a location block that declares even
# one add_header silently discards every add_header from the server level. The
# HTML responses are exactly where these matter most, so they get included again
# in the locations that set their own caching headers.
#
# The API sets its own equivalents via helmet; nginx has to cover the static app,
# which helmet never sees. See docs/LAUNCH.md §2.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP baseline from docs/LAUNCH.md §2, simplified for this topology: nginx
# reverse-proxies /api and /uploads, so the API is same-origin and 'self' already
# covers both — no api.<domain> entry is needed here.
#
#   'unsafe-inline' in style-src and worker-src blob: are both required by
#   maplibre-gl. picsum.photos is the seed data's placeholder image host and
#   should come out once real photos are served from /uploads. plausible.io is
#   only needed when VITE_ANALYTICS_DOMAIN is set at build time.
#
# Behind TLS, add `upgrade-insecure-requests` — it is omitted here because it
# breaks plain-http local runs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://picsum.photos; connect-src 'self' https://tiles.openfreemap.org https://plausible.io; worker-src blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
